- name: int_fact_agg_features_login_history_v2__daily_partials
  description: 'Reusable per-entity, per-event_date partial aggregate state. Composable by construction:
    every published window is a fold over these rows.'
  data_tests:
  - fs_unique_combination:
      arguments:
        combination_of_columns:
        - safe_id
        - event_date
  columns:
  - name: event_date
    description: Calendar date of the events summarised by this row.
    data_tests:
    - not_null
  - name: safe_id
    description: Entity key (safe_id).
    data_tests:
    - not_null
- name: int_fact_agg_features_login_history_v2__alltime_state
  description: Sealed all_time accumulator, one row per entity. Advances only over event_dates old enough
    to be immune to late arrivals.
  data_tests:
  - fs_unique_combination:
      arguments:
        combination_of_columns:
        - safe_id
  columns:
  - name: safe_id
    description: Entity key (safe_id).
    data_tests:
    - not_null
  - name: _state_as_of_date
    description: 'Watermark: every event_date at or before this has been folded in. Drives the self-healing,
      idempotent catch-up range.'
    data_tests:
    - not_null
