# Local + CI profile. Production targets are wired through env vars so the same
# committed models run unchanged on DuckDB, Databricks and Snowflake.
feature_mart:
  target: "{{ env_var('DBT_TARGET', 'local') }}"
  outputs:

    # --- local dev: DuckDB on the local filesystem --------------------------
    local:
      type: duckdb
      path: "{{ env_var('DBT_DUCKDB_PATH', 'warehouse.duckdb') }}"
      schema: main
      threads: 4
      extensions: ["httpfs"]

    # --- CI / integration: DuckDB backed by SeaweedFS S3 --------------------
    seaweed:
      type: duckdb
      path: "{{ env_var('DBT_DUCKDB_PATH', 'warehouse.duckdb') }}"
      schema: main
      threads: 4
      extensions: ["httpfs"]
      settings:
        s3_endpoint: "{{ env_var('S3_ENDPOINT', 'localhost:8333') }}"
        s3_access_key_id: "{{ env_var('S3_ACCESS_KEY', 'featuremart') }}"
        s3_secret_access_key: "{{ env_var('S3_SECRET_KEY', 'featuremart') }}"
        s3_use_ssl: false
        s3_url_style: "path"
        s3_region: "us-east-1"

    # --- production candidates ---------------------------------------------
    databricks:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST', '') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH', '') }}"
      token: "{{ env_var('DATABRICKS_TOKEN', '') }}"
      catalog: "{{ env_var('DATABRICKS_CATALOG', 'gold') }}"
      schema: "{{ env_var('DATABRICKS_SCHEMA', 'feature_store') }}"
      threads: 8

    snowflake:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', '') }}"
      user: "{{ env_var('SNOWFLAKE_USER', '') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD', '') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'TRANSFORMER') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'GOLD') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'COMPUTE_WH') }}"
      schema: "{{ env_var('SNOWFLAKE_SCHEMA', 'FEATURE_STORE') }}"
      threads: 8
