name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_SYSTEM_PYTHON: "1"

jobs:

  # ---------------------------------------------------------------------------
  # The GitOps gate. A spec and its generated models cannot be allowed to
  # disagree, so this regenerates from the specs and fails on any difference.
  # Hand-editing a model, or changing a spec without regenerating, stops here.
  # ---------------------------------------------------------------------------
  generator:
    name: generator (drift, lint, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv venv --python 3.11
      - run: uv pip install -e ".[dev]"

      - name: Specs are valid
        run: .venv/bin/python -m generator.cli validate

      - name: Generated output matches the specs
        run: .venv/bin/python -m generator.cli generate --check

      - name: Example specs in the authoring reference still parse
        run: |
          for f in features/examples/*.yml; do
            .venv/bin/python -m generator.cli explain "$f" > /dev/null
            echo "ok $f"
          done

      - name: Lint
        run: |
          .venv/bin/ruff check generator tools tests
          .venv/bin/ruff format --check generator tools tests

      - name: Unit tests
        run: .venv/bin/python -m pytest tests -q

  # ---------------------------------------------------------------------------
  # Runs the real pipeline against DuckDB: a backfill, a sequence of daily
  # increments, every generated invariant, adapter conformance, an independent
  # brute-force recomputation, and the operational scenarios (retry, gap, late
  # arrival). This is the job that would catch a wrong number.
  # ---------------------------------------------------------------------------
  pipeline:
    name: pipeline (dbt + invariants + brute force)
    runs-on: ubuntu-latest
    needs: generator
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv venv --python 3.11
      - run: uv pip install -e ".[dbt,dev]"

      - name: Build the fixture
        run: |
          .venv/bin/python tools/gen_seed.py
          cd transform && ../.venv/bin/dbt seed --vars '{target_date: 2026-07-01}'
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/transform

      - name: Backfill, then run a fortnight of daily increments
        # Each day builds T and then refreshes the revision window behind it,
        # exactly as the Airflow DAG does, so CI exercises the real cadence
        # rather than a simplified one.
        run: |
          cd transform
          ../.venv/bin/dbt run --vars '{target_date: 2026-08-20, fs_backfill_from: 2026-07-01}'
          for d in 2026-08-21 2026-08-22 2026-08-23 2026-08-24 2026-08-25 2026-08-26 \
                   2026-08-27 2026-08-28 2026-08-29 2026-08-30 2026-08-31 \
                   2026-09-01 2026-09-02 2026-09-03; do
            ../.venv/bin/dbt run --vars "{target_date: $d}" -q
            for i in 1 2 3; do
              r=$(python3 -c "import datetime;print(datetime.date.fromisoformat('$d')-datetime.timedelta(days=$i))")
              ../.venv/bin/dbt run --select tag:fact_agg_features_login_history_v2 \
                                            tag:fact_agg_features_login_device_v1 \
                                   --vars "{target_date: $r}" -q
            done
          done
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/transform

      - name: Schema tests, generated invariants, adapter conformance
        run: |
          cd transform && ../.venv/bin/dbt test --vars '{target_date: 2026-09-03}'
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/transform

      - name: Independent brute-force recomputation
        # Several dates, not just the newest: a settled partition and a
        # provisional one exercise different paths through the state merge.
        run: |
          for d in 2026-08-25 2026-08-31 2026-09-01 2026-09-02 2026-09-03; do
            .venv/bin/python tools/verify_against_bruteforce.py $d
          done

      - name: No partition references events after its own as-of date
        run: |
          .venv/bin/python - <<'PY'
          import duckdb, sys
          con = duckdb.connect("transform/warehouse.duckdb", read_only=True)
          bad = 0
          for m in ("fact_agg_features_login_history_v2",
                    "fact_agg_features_login_device_v1"):
              n = con.execute(
                  f"select count(*) from marts.{m} "
                  "where _last_event_date > target_date"
              ).fetchone()[0]
              print(f"{m}: {n} leaking row(s)")
              bad += n
          sys.exit(1 if bad else 0)
          PY

      - name: Approximate-distinct accuracy
        run: .venv/bin/python tools/verify_kmv_accuracy.py 2026-09-03

      - name: Operational scenarios (retry, gap, late arrival, replay, revision, ordering)
        run: .venv/bin/python tools/e2e_scenarios.py

      - name: dbt docs build
        run: |
          cd transform && ../.venv/bin/dbt docs generate --vars '{target_date: 2026-09-03}'
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/transform

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dbt-artifacts
          path: |
            transform/target/manifest.json
            transform/target/run_results.json
            transform/logs/dbt.log
          retention-days: 7

  # ---------------------------------------------------------------------------
  # The DAG is generated from the registry, so a spec change can break DAG
  # import. Catch that here rather than in the scheduler.
  # ---------------------------------------------------------------------------
  orchestration:
    name: orchestration (DAG imports)
    runs-on: ubuntu-latest
    needs: generator
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv venv --python 3.11
      - run: uv pip install "apache-airflow==2.10.5" pendulum

      - name: DAG parses and has no import errors
        run: |
          export AIRFLOW_HOME="${{ github.workspace }}/.airflow"
          export FS_PROJECT_ROOT="${{ github.workspace }}"
          .venv/bin/python - <<'PY'
          import os
          from airflow.models import DagBag
          bag = DagBag(os.path.join(os.environ["FS_PROJECT_ROOT"], "orchestration/dags"),
                       include_examples=False)
          if bag.import_errors:
              for path, err in bag.import_errors.items():
                  print(f"{path}\n{err}")
              raise SystemExit(1)
          dag = bag.get_dag("feature_store_daily")
          print(f"feature_store_daily: {len(dag.tasks)} tasks")
          for t in sorted(t.task_id for t in dag.tasks):
              print(f"  {t}")
          PY
